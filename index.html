<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Отпуска 2027</title>
<style>
:root{--bg:#fff;--tx:#37352f;--mut:#9b9a97;--bd:#e9e9e7;--hov:#f1f1ef;--side:#f7f7f5;--hol:#fbf3db;--holtx:#8a6d00;--tr:#ddebf1;--trtx:#1f6c9f;--acc:#2383e2;--accbg:#d3e5ef;--err:#e03e3e}
@media(prefers-color-scheme:dark){:root{--bg:#191919;--tx:#e6e6e4;--mut:#7f7f7d;--bd:#2f2f2f;--hov:#2a2a2a;--side:#202020;--hol:#4a3f17;--holtx:#f0d77a;--tr:#1e3a4d;--trtx:#7fc1ee;--acc:#4a9df0;--accbg:#1f3a52}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.app{display:grid;grid-template-columns:320px 1fr;min-height:100vh}
aside{background:var(--side);border-right:1px solid var(--bd);padding:24px 16px;overflow:auto;max-height:100vh;position:sticky;top:0;display:flex;flex-direction:column}
main{padding:40px 48px 64px;max-width:1280px}
h1{font-size:34px;line-height:1.2;margin:0 0 4px;font-weight:700}
.sub{color:var(--mut);margin:0 0 28px}
h2{font-size:12px;font-weight:600;color:var(--mut);margin:0 0 8px;padding:0 6px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;border-radius:4px;padding:4px 8px}
button:hover{background:var(--hov)}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.add{display:flex;align-items:center;gap:8px;width:100%;color:var(--mut);padding:6px}
.add b{font-size:18px;font-weight:400;width:20px;text-align:center}
.person{padding:8px 6px;border-radius:4px}
.person:hover{background:var(--hov)}
.pn{display:flex;align-items:center;gap:8px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.pn span.sp{flex:1}
.pn button{color:var(--mut);padding:0 6px;opacity:0}
.person:hover .pn button{opacity:1}
.rg{color:var(--mut);font-size:13px;margin:2px 0 0 18px}
.empty{color:var(--mut);padding:6px}
.form{background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:12px;box-shadow:0 1px 2px rgba(15,15,15,.08);margin-bottom:16px}
.form input{width:100%;font:inherit;font-weight:600;font-size:16px;border:0;border-bottom:1px solid var(--bd);padding:4px 2px 8px;background:none;color:inherit;margin-bottom:10px}
.form input:focus{outline:0;border-color:var(--acc)}
.slot{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 8px;border-radius:4px;border:1px solid transparent;cursor:pointer;margin-bottom:2px}
.slot:hover{background:var(--hov)}
.slot.on{border-color:var(--acc);background:var(--accbg)}
.slot small{display:block;color:var(--mut);font-size:12px}
.slot .v{text-align:right;white-space:nowrap}
.msgs{font-size:12.5px;color:var(--mut);margin:8px 2px;min-height:18px}
.msgs .e{color:var(--err)}
.msgs .ok{color:#0f7b6c}
.btns{display:flex;gap:6px;justify-content:flex-end}
.pri{background:var(--acc);color:#fff;font-weight:600}
.pri:hover{background:var(--acc);filter:brightness(.92)}
.pri:disabled{opacity:.4;cursor:not-allowed;filter:none}
.sync{margin-top:auto;padding-top:16px;border-top:1px solid var(--bd);font-size:12px;color:var(--mut);display:flex;align-items:center;justify-content:space-between;gap:8px}
.sync .err{color:var(--err)}
.sync button{font-size:12px;border:1px solid var(--bd);padding:3px 8px;flex:none}
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:28px 32px}
.m h3{font-size:15px;margin:0 0 6px;padding:0 4px}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.g .h{text-align:center;font-size:11px;color:var(--mut);padding:2px 0}
.c{position:relative;height:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:4px;font-size:13px;cursor:pointer;user-select:none}
.c:hover{background:var(--hov)}
.c.we{color:var(--mut)}
.c.hol{background:var(--hol);color:var(--holtx);font-weight:700}
.c.tr{background:var(--tr);color:var(--trtx);font-weight:700}
.c.s0,.c.s1,.c.s2{background:var(--accbg);color:var(--acc);font-weight:700}
.c.s1{background:#e4dff3;color:#6940a5}
.c.s2{background:#fbe4e4;color:#c4554d}
.c.pend{outline:2px solid var(--acc);outline-offset:-2px}
.dots{position:absolute;bottom:2px;display:flex;gap:2px}
.dots i{width:5px;height:5px;border-radius:50%}
.leg{display:flex;flex-wrap:wrap;gap:14px;color:var(--mut);font-size:13px;margin:0 0 24px}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg i{width:14px;height:14px;border-radius:3px;display:inline-block}
.hint{color:var(--mut);font-size:13px;margin:-14px 0 24px}
@media(max-width:860px){.app{grid-template-columns:1fr}aside{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--bd)}main{padding:24px 16px}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div id="formBox"></div>
    <h2>Сотрудники</h2>
    <div id="list"></div>
    <button class="add" id="addBtn"><b>+</b> Добавить отпуск</button>
    <div class="sync">
      <span id="syncMsg">Загрузка…</span>
      <button id="refreshBtn">Обновить</button>
    </div>
  </aside>
  <main>
    <h1>🌴 Отпуска 2027</h1>
    <p class="sub">Казахстан · пятидневная рабочая неделя · 247 рабочих дней</p>
    <div class="leg">
      <span><i style="background:var(--hol)"></i>праздник</span>
      <span><i style="background:var(--tr)"></i>перенесённый выходной</span>
      <span><i style="background:var(--accbg)"></i>выбранные даты</span>
    </div>
    <p class="hint" id="hint">Нажмите «+ Добавить отпуск», введите имя и выберите даты в календаре.</p>
    <div class="cal" id="cal"></div>
  </main>
</div>
<script>
const API="https://script.google.com/macros/s/AKfycbzp6qXYqwk5JhbWctgmUjKprJPRWqqoQIKZ2ZWrP4nmPLM6gRVsgRkKF4-aoGsNKkwM/exec";
const Y=2027, DAY=864e5;
const HOL=["01-01","01-02","01-07","03-08","03-15","03-21","03-22","03-23","05-01","05-07","05-09","05-16","07-06","10-25","12-16"];
const TR=["01-04","03-24","05-03","05-10"];
const MN=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const COLORS=["#e03e3e","#d9730d","#dfab01","#0f7b6c","#0b6e99","#6940a5","#ad1a72","#64473a"];
const LABELS=[["Отпуск 1","ровно 14 дней"],["Отпуск 2","вместе с третьим — 10 дней"],["Отпуск 3","вместе со вторым — 10 дней"]];
const $=id=>document.getElementById(id);
const dn=(m,d)=>Date.UTC(Y,m,d)/DAY;
const YE=dn(11,31);
const fmt=n=>new Date(n*DAY).toLocaleDateString("ru",{day:"numeric",month:"short",timeZone:"UTC"}).replace(".","");
const len=r=>r?r.e-r.s+1:0;
const rfmt=r=>r?(r.s===r.e?fmt(r.s):fmt(r.s)+" – "+fmt(r.e)):"";
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let people=[], busy=false;
try{people=JSON.parse(localStorage.getItem("vac2027")||"[]")}catch(e){}
const saveLocal=()=>{try{localStorage.setItem("vac2027",JSON.stringify(people))}catch(e){}};

function setSync(text,isErr=false){
  const el=$("syncMsg");
  el.textContent=text;
  el.className=isErr?"err":"";
}

async function loadRemote(){
  setSync("Загрузка…");
  try{
    const res=await fetch(API+"?t="+Date.now(),{cache:"no-store"});
    if(!res.ok)throw new Error("HTTP "+res.status);
    const json=await res.json();
    if(!json.ok)throw new Error(json.error||"Ошибка ответа");
    people=Array.isArray(json.people)?json.people:[];
    saveLocal();
    renderAll();
    setSync("Синхронизировано");
  }catch(e){
    setSync("Ошибка загрузки: "+e.message,true);
  }
}

async function postRemote(payload){
  if(busy)return false;
  busy=true;
  renderForm();
  setSync("Сохранение…");
  try{
    const res=await fetch(API,{
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify(payload)
    });
    if(!res.ok)throw new Error("HTTP "+res.status);
    const json=await res.json();
    if(!json.ok)throw new Error(json.error||"Ошибка сохранения");
    people=Array.isArray(json.people)?json.people:people;
    saveLocal();
    setSync("Сохранено");
    return true;
  }catch(e){
    setSync("Ошибка сохранения: "+e.message,true);
    return false;
  }finally{
    busy=false;
    renderForm();
  }
}

let draft=null, active=0, pend=null;

function problems(){
  const p=[], r=draft.r;
  if(!draft.name.trim()) p.push("Введите имя");
  if(!r[0]) p.push("Выберите начало отпуска на 14 дней");
  if(!r[1]||!r[2]) p.push("Выберите два отпуска на 10 дней вместе");
  else if(len(r[1])+len(r[2])!==10) p.push("Отпуска 2 и 3 дают "+(len(r[1])+len(r[2]))+" из 10 дней");
  const rs=r.filter(Boolean);
  for(let i=0;i<rs.length;i++)for(let j=i+1;j<rs.length;j++)
    if(rs[i].s<=rs[j].e&&rs[j].s<=rs[i].e){p.push("Отпуска пересекаются");i=9;}
  return p;
}

function renderForm(){
  const box=$("formBox");
  $("addBtn").style.display=draft?"none":"";
  $("hint").textContent=draft
    ? (active===0?"Отпуск 1: нажмите на первый день — 14 дней выберутся сами."
       :"Отпуск "+(active+1)+": нажмите на первый и на последний день."+(pend!=null?" Начало: "+fmt(pend)+".":""))
    : "Нажмите «+ Добавить отпуск», введите имя и выберите даты в календаре.";
  if(!draft){box.innerHTML="";return}
  const r=draft.r, pr=problems();
  const sum=len(r[1])+len(r[2]);
  box.innerHTML=`<div class="form">
    <input id="nm" placeholder="Имя" value="${esc(draft.name)}" maxlength="40">
    ${[0,1,2].map(i=>`<div class="slot ${active===i?"on":""}" data-i="${i}">
      <div>${LABELS[i][0]}<small>${LABELS[i][1]}</small></div>
      <div class="v">${r[i]?rfmt(r[i])+"<small>"+len(r[i])+" дн.</small>":"<small>не выбрано</small>"}</div></div>`).join("")}
    <div class="msgs">${pr.length?pr.map(x=>`<div class="e">${x}</div>`).join(""):`<div class="ok">Всё сходится: 14 + `+sum+` дней</div>`}</div>
    <div class="btns"><button id="cancel" ${busy?"disabled":""}>Отмена</button><button class="pri" id="saveBtn" ${pr.length||busy?"disabled":""}>${busy?"Сохранение…":"Сохранить"}</button></div>
  </div>`;
  const nm=$("nm");
  nm.oninput=()=>{draft.name=nm.value;const pr=problems();$("saveBtn").disabled=!!pr.length||busy;box.querySelector(".msgs").innerHTML=pr.length?pr.map(x=>`<div class="e">${x}</div>`).join(""):`<div class="ok">Всё сходится: 14 + `+(len(draft.r[1])+len(draft.r[2]))+` дней</div>`};
  box.querySelectorAll(".slot").forEach(s=>s.onclick=()=>{active=+s.dataset.i;pend=null;renderAll()});
  $("cancel").onclick=()=>{draft=null;pend=null;renderAll()};
  $("saveBtn").onclick=async()=>{
    const existing=draft.id?people.find(x=>String(x.id)===String(draft.id)):null;
    const person={
      id:existing?String(existing.id):String(Date.now())+"-"+Math.random().toString(36).slice(2,6),
      name:draft.name.trim(),
      color:existing?existing.color:COLORS[people.length%COLORS.length],
      r:draft.r.map(x=>({s:x.s,e:x.e}))
    };
    const labels=person.r.map(r=>`${rfmt(r)} (${len(r)} дн.)`);
    const ok=await postRemote({action:"upsert",person,labels});
    if(ok){draft=null;pend=null;renderAll()}
  };
}

function renderList(){
  const l=$("list");
  if(!people.length){l.innerHTML='<div class="empty">Пока никого нет</div>';return}
  l.innerHTML=people.map(p=>`<div class="person"><div class="pn"><i class="dot" style="background:${p.color}"></i><span class="sp">${esc(p.name)}</span>
    <button data-e="${p.id}" title="Изменить">✎</button><button data-d="${p.id}" title="Удалить">✕</button></div>
    ${p.r.map(r=>`<div class="rg">${rfmt(r)} · ${len(r)} дн.</div>`).join("")}</div>`).join("");
  l.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{
    const p=people.find(x=>String(x.id)===b.dataset.e);
    if(!p)return;
    draft={id:p.id,name:p.name,r:p.r.map(x=>({...x}))};active=0;pend=null;renderAll();
  });
  l.querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{
    const p=people.find(x=>String(x.id)===b.dataset.d);
    if(!p||!confirm("Удалить «"+p.name+"»?"))return;
    const ok=await postRemote({action:"delete",id:String(p.id)});
    if(ok)renderAll();
  });
}

function renderCal(){
  const cover={};
  people.forEach(p=>{if(draft&&String(draft.id)===String(p.id))return;p.r.forEach(r=>{for(let n=r.s;n<=r.e;n++)(cover[n]=cover[n]||[]).push(p.color)})});
  let h="";
  for(let m=0;m<12;m++){
    const first=(new Date(Y,m,1).getDay()+6)%7, days=new Date(Y,m+1,0).getDate();
    h+=`<div class="m"><h3>${MN[m]}</h3><div class="g">`+["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].map(x=>`<div class="h">${x}</div>`).join("");
    for(let i=0;i<first;i++)h+="<div></div>";
    for(let d=1;d<=days;d++){
      const n=dn(m,d), key=String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0"), wd=(first+d-1)%7;
      let cls="c";
      if(wd>4)cls+=" we";
      if(HOL.includes(key))cls+=" hol"; else if(TR.includes(key))cls+=" tr";
      if(draft)draft.r.forEach((r,i)=>{if(r&&n>=r.s&&n<=r.e)cls+=" s"+i});
      if(pend===n)cls+=" pend";
      const dots=(cover[n]||[]).slice(0,4).map(c=>`<i style="background:${c}"></i>`).join("");
      h+=`<div class="${cls}" data-n="${n}">${d}${dots?`<span class="dots">${dots}</span>`:""}</div>`;
    }
    h+="</div></div>";
  }
  const c=$("cal");c.innerHTML=h;
  c.querySelectorAll(".c").forEach(el=>el.onclick=()=>pick(+el.dataset.n));
}

function next(){const i=draft.r.findIndex(x=>!x);active=i>=0?i:active}
function pick(n){
  if(!draft)return;
  if(active===0){
    if(n+13>YE){alert("14 дней не помещаются в 2027 год — выберите более раннюю дату.");return}
    draft.r[0]={s:n,e:n+13};pend=null;next();
  }else if(pend==null){pend=n}
  else{draft.r[active]={s:Math.min(pend,n),e:Math.max(pend,n)};pend=null;next()}
  renderAll();
}

function renderAll(){renderForm();renderList();renderCal()}
$("addBtn").onclick=()=>{draft={name:"",r:[null,null,null]};active=0;pend=null;renderAll();$("nm").focus()};
$("refreshBtn").onclick=loadRemote;

renderAll();
loadRemote();
</script>
</body>
</html>
